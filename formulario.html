<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="./formulario.css">
</head>
<body>

    <div class="contenedor">

        <h5 class="etiqueta-superior">CONTACTO</h5>
        <h1>Cuentenos sobre su necesidad</h1>
        <p class="subtitulo">Complete el formulario. Los campos marcados con * son obligatorios.</p>

        <form>

            <h2>Datos personales</h2>
            <div class="fila">
                <div class="campo">
                    <label>Nombre *</label>
                    <input required type="text" placeholder="Laura">
                </div>
                <div class="campo">
                    <label>Apellido *</label>
                    <input required type="text" placeholder="Martinez">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>Correo *</label>
                    <input required type="email" placeholder="nombre@empresa.com">
                </div>
                <div class="campo">
                    <label>Telefono</label>
                    <input type="tel" placeholder="+57 300 000 0000">
                </div>
            </div>

            <h2>Organizacion</h2>
            <div class="fila">
                <div class="campo">
                    <label>Empresa</label>
                    <input type="text">
                </div>
                <div class="campo">
                    <label>Numero de empleados</label>
                    <input type="number">
                </div>
            </div>

            <div class="campo">
                <label>Servicio de interes *</label>
                <select required>
                    <option>Seleccione un servicio</option>
                    <option>Seguridad de aplicaciones</option>
                    <option>Cloud Security</option>
                    
                </select>
            </div>

            <h2>Disponibilidad</h2>
            <div class="fila">
                <div class="campo">
                    <label>Fecha preferida</label>
                    <input type="date">
                </div>
                <div class="campo">
                    <label>Hora preferida</label>
                    <input type="time">
                </div>
            </div>

            <fieldset>
                <legend>Modalidad de contacto</legend>
                <label class="opcion"><input type="radio" name="modalidad" checked> Correo electronico</label>
                <label class="opcion"><input type="radio" name="modalidad"> Telefono</label>
                <label class="opcion"><input type="radio" name="modalidad"> Videollamada</label>
            </fieldset>

            <fieldset>
                <legend>Temas adicionales de interes</legend>
                <label class="opcion"><input type="checkbox"> Seguridad de aplicaciones</label>
                <label class="opcion"><input type="checkbox"> Cloud Security</label>
                <label class="opcion"><input type="checkbox"> AI Security</label>
            </fieldset>

            <div class="campo">
                <label>Describa su necesidad *</label>
                <textarea required rows="5" placeholder="Cuntenos brevemente que necesita..." maxlength="1200"></textarea>
                <p class="ayuda">Maximo 1200 caracteres.</p>
            </div>

            <div class="campo">
                <label>Documento de soporte</label>
                <div class="archivo">
                    <input type="file">
                </div>
                <p class="ayuda">Formatos sugeridos: PDF, Word o Excel.</p>
            </div>

            <label class="opcion">
                <input type="checkbox"> Acepto el tratamiento de la información suministrada.
            </label>

            <div class="botones">
            <button type="submit" class="btn-primario">Enviar solicitud</button>
            <button type="reset" class="btn-secundario">Limpiar</button>
            </div>

        </form>

    </div>

</body>
</html>
