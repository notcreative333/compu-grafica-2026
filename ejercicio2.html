<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 2</title>
<link rel="stylesheet" href="./ejercicio2.css">
</head>
<body>

<div class="contenedor">

  <h1>Reservar mesa</h1>

  <form>

    <div class="fila">
      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <div class="campo">
        <label for="hora">Hora</label>
        <input type="time" id="hora" name="hora" required>
      </div>
    </div>

    <div class="campo">
      <label for="personas">Número de personas</label>
      <input type="number" id="personas" name="personas" min="1" max="20" required>
    </div>

    <div class="campo">
      <label for="comentarios">Comentarios</label>
      <textarea id="comentarios" name="comentarios" rows="4" placeholder="Alguna preferencia o comentario adicional..."></textarea>
    </div>

    <button type="submit" class="boton">Confirmar reserva</button>

  </form>

</div>

</body>
</html>
